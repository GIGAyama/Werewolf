<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- この画面は JavaScript を一切使わない（つながっていない時に動くものは少ないほどよい）。
         そのぶん script-src は none にできる。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#050510" />
    <meta name="color-scheme" content="dark" />
    <title>つながっていません — 人狼ゲーム</title>
    <style>
      /* アプリ本体と同じ書体・同じ配色にして、「壊れた」と思わせない */
      @font-face {
        font-family: 'M PLUS Rounded 1c';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/mplus-rounded-1c-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'M PLUS Rounded 1c';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('./fonts/mplus-rounded-1c-900.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: clamp(14px, 1.9vw + 6px, 20px);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.5rem + env(safe-area-inset-left, 0px));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        text-align: center;
        line-height: 1.8;
        font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Kaku Gothic ProN',
          'Noto Sans JP', 'Yu Gothic UI', system-ui, sans-serif;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #090a0f, #141b2d, #1a0b1f, #0d1b2a);
      }
      .panel {
        width: 100%;
        max-width: 34rem;
        padding: 2rem 1.5rem;
        border-radius: 32px;
        background: rgba(20, 25, 45, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      }
      .moon {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 900;
        letter-spacing: 0.05em;
      }
      p {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        color: rgba(255, 255, 255, 0.92);
      }
      rt {
        font-size: 0.55em;
        color: rgba(255, 255, 255, 0.85);
      }
      rp {
        display: none;
      }
      .retry {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        min-width: 44px;
        margin-top: 2rem;
        padding: 0 2rem;
        border-radius: 24px;
        font-size: 1.375rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-decoration: none;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        box-shadow: 0 8px 0 #0284c7, 0 15px 20px rgba(0, 0, 0, 0.4);
        touch-action: manipulation;
      }
      .retry:active {
        transform: translateY(8px);
        box-shadow: 0 0 0 #0284c7;
      }
      .retry:focus-visible {
        outline: 3px solid #fde047;
        outline-offset: 3px;
      }
      footer {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
      }
      @media (forced-colors: active) {
        .retry {
          border: 2px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="moon" role="img" aria-label="つき">🌙</div>
      <h1>いま インターネットに つながっていません</h1>
      <p>
        Wi-Fi が
        <ruby>切<rp>(</rp><rt>き</rt><rp>)</rp></ruby>れているかもしれません。<br />
        つながってから、もういちど ためしてください。
      </p>
      <p>
        いちど
        <ruby>読<rp>(</rp><rt>よ</rt><rp>)</rp></ruby>みこんだ あとなら、つながっていなくても
        <ruby>遊<rp>(</rp><rt>あそ</rt><rp>)</rp></ruby>べます。
      </p>
      <a class="retry" href="./">もういちど ためす</a>
    </div>
    <footer>© 2026 人狼ゲーム GIGA山</footer>
  </body>
</html>
