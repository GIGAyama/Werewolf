name: Deploy to GitHub Pages

on:
  # main ブランチへの push で自動的にビルド＆公開
  push:
    branches: [main]
  # Actions タブから手動実行も可能
  workflow_dispatch:

# GITHUB_TOKEN に Pages への書き込み権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つにまとめる（実行中のものは完了させる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 脆弱性は「報告するが止めない」。残っている4件はメジャー更新でしか
      # 解消できず、いずれも開発時にしか動かない依存のため（README 参照）。
      # 止めてしまうと、直せない理由で公開ができなくなる。
      - name: npm audit（報告のみ）
        run: npm audit --audit-level=critical || true

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - run: npm run build

      # 品質ゲートは dist/ を見るのでビルドの後に走らせる。
      # ここが落ちたら公開しない（GIGA Standard v4 の必須項目に穴がある状態）。
      - name: 品質ゲート
        run: npm run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
